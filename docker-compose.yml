version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm
      POSTGRES_PASSWORD: gymcrm_local
    ports:
      - '5433:5432'
    volumes:
      - gymcrm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymcrm -d gymcrm']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://gymcrm:gymcrm_local@db:5432/gymcrm
      - JWT_SECRET=${JWT_SECRET:-gymcrm-local-development-secret-change-before-deploy}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  gymcrm-postgres-data:
